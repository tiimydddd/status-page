<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STCA 同學手機 Service Health Status</title>
  <style>
    :root {
      --navy: #191b1d;
      --navy-2: #232527;
      --bg: #f2f4f5;
      --card: #ffffff;
      --text: #191b1d;
      --muted: #60656c;
      --border: #dfe3e8;
      --ok: #00b06f;
      --ok-bg: #e6f7f0;
      --warn: #f5a623;
      --warn-bg: #fff6e5;
      --down: #e2231a;
      --down-bg: #fdebec;
      --link: #0066ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .topbar {
      background: var(--navy);
      color: #ffffff;
      padding: 20px 16px;
      border-bottom: 1px solid #393b3d;
    }
    .topbar-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #c8cdd2 100%);
      color: var(--navy);
      font-weight: 900;
      font-size: 15px;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
    }
    .brand-sub {
      font-size: 12px;
      color: #b8bdc2;
    }
    .updated-pill {
      font-size: 12px;
      background: var(--navy-2);
      border: 1px solid #393b3d;
      padding: 6px 12px;
      border-radius: 6px;
      color: #d6dadf;
    }

    .container {
      max-width: 920px;
      margin: 24px auto 48px;
      padding: 0 16px;
    }

    .overall-banner {
      padding: 16px 20px;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .overall-banner.ok { background: var(--ok); }
    .overall-banner.warn { background: var(--warn); }
    .overall-banner.down { background: var(--down); }
    .overall-sub {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.95;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 26px 0 12px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .toggle-all {
      font-size: 13px;
      color: var(--link);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 8px;
    }
    .toggle-all:hover { text-decoration: underline; }

    .incident-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--down);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .incident-card.warn { border-left-color: var(--warn); }
    .incident-card.ok { border-left-color: var(--ok); }
    .incident-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .incident-title {
      font-size: 16px;
      font-weight: 700;
    }
    .incident-item {
      padding: 8px 0;
      border-top: 1px solid #eef0f2;
      font-size: 14px;
    }
    .incident-time {
      font-weight: 700;
      font-size: 13px;
      color: var(--down);
      margin-bottom: 2px;
    }
    .incident-card.warn .incident-time { color: #9c6200; }
    .incident-card.ok .incident-time { color: #007a4d; }

    .incident-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
    }
    .incident-link:hover { text-decoration: underline; }

    .group-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .group-header {
      width: 100%;
      background: var(--card);
      border: none;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .group-header:hover { background: #fafbfc; }
    .group-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chevron {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s;
      display: inline-block;
      width: 14px;
    }
    .group-card.open .chevron { transform: rotate(90deg); }
    .group-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .group-tag {
      font-size: 12px;
      color: var(--muted);
      background: #eef1f4;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .status-pill.ok { background: var(--ok-bg); color: #007a4d; }
    .status-pill.warn { background: var(--warn-bg); color: #9c6200; }
    .status-pill.down { background: var(--down-bg); color: #b51912; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.down { background: var(--down); }

    .group-body {
      display: none;
      border-top: 1px solid var(--border);
      background: #fcfcfd;
    }
    .group-card.open .group-body { display: block; }

    .service-row {
      padding: 14px 20px 14px 44px;
      border-bottom: 1px solid #eef0f2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .service-row:last-child { border-bottom: none; }
    .svc-info {
      flex: 1;
      min-width: 180px;
    }
    .svc-name { font-weight: 600; font-size: 14px; }
    .svc-desc { font-size: 12px; color: var(--muted); }

    .svc-right {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
    }
    .uptime-bars {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .bar {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--ok);
    }
    .bar.warn { background: var(--warn); }
    .bar.down { background: var(--down); }
    .svc-status-text {
      font-size: 13px;
      font-weight: 600;
      min-width: 120px;
      text-align: right;
    }
    .svc-status-text.ok { color: #007a4d; }
    .svc-status-text.warn { color: #9c6200; }
    .svc-status-text.down { color: #b51912; }

    .legend {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 16px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #eef0f2;
    }
    .history-item:first-child { padding-top: 0; }
    .history-item:last-child { border-bottom: none; padding-bottom: 0; }
    .history-date {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .history-title {
      font-size: 15px;
      font-weight: 700;
      margin: 2px 0 4px;
    }
    .history-detail {
      font-size: 13px;
      color: #3a3f45;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 32px;
    }

    @media (max-width: 600px) {
      .service-row { padding-left: 20px; }
      .uptime-bars { display: none; }
      .svc-right { margin-left: 0; }
      .svc-status-text { min-width: auto; text-align: left; }
    }
  </style>
</head>

        <div>
          <h1 class="brand-title">STCA 同學手機 Service Health Status</h1>
          <div class="brand-sub">即時服務健康與外部系統通報頁面</div>
        </div>
      </div>
      <div class="updated-pill">最後更新：<span id="last-updated"></span></div>
    </div>
  </header>

    <div id="active-incidents"></div>

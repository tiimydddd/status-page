<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STCA 同學手機 Service Health Status</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d8dee4;
      --primary: #0969da;
      --green: #1a7f37;
      --green-bg: #dafbe1;
      --yellow: #9a6700;
      --yellow-bg: #fff8c5;
      --red: #cf222e;
      --red-bg: #ffebe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 780px;
      margin: 32px auto;
      padding: 0 16px;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      border-color: var(--primary);
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #fafbfc;
    }
    .student-title {
      font-size: 18px;
      font-weight: 700;
    }
    .service-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .service-row:last-child {
      border-bottom: none;
    }
    .service-name {
      font-weight: 600;
    }
    .service-desc {
      font-size: 13px;
      color: var(--muted);
    }
    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
